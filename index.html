<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Guillaume Verhaeghe — Expériences de bascule." />
  <title>Guillaume Verhaeghe — Expériences de bascule</title>

  <style>
    :root{
      --ink:#181815;
      --paper:#f1eee6;
      --paper-2:#e7e1d6;
      --line:rgba(24,24,21,.18);
      --soft:rgba(24,24,21,.62);
      --max:1380px;
      --pad:clamp(22px,4vw,64px);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    .shell{max-width:var(--max); margin:auto; padding-left:var(--pad); padding-right:var(--pad)}

    .nav{
      position:fixed; inset:0 0 auto 0; z-index:30;
      backdrop-filter: blur(9px);
      background:rgba(241,238,230,.72);
      border-bottom:1px solid transparent;
      transition:.3s ease;
    }
    .nav.scrolled{border-bottom-color:var(--line)}
    .navin{
      height:76px; display:flex; align-items:center; justify-content:space-between;
      max-width:var(--max); margin:auto; padding:0 var(--pad);
    }
    .brand{
      display:flex; gap:12px; align-items:center;
      text-transform:uppercase; letter-spacing:.08em;
      font-size:12px; font-weight:700;
    }
    .mark{
      width:27px;height:27px;border:1px solid var(--ink);border-radius:50%;
      position:relative;
    }
    .mark:after{
      content:"";position:absolute;width:7px;height:7px;border-radius:50%;
      background:var(--ink);left:9px;top:9px;
    }
    .navlinks{display:flex;gap:28px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .navlinks a{opacity:.65;transition:.2s}
    .navlinks a:hover{opacity:1}

    .hero{
      min-height:100vh;
      display:grid;
      align-items:end;
      position:relative;
      border-bottom:1px solid var(--line);
      overflow:hidden;
    }
    .hero-art{
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 73% 28%, rgba(0,0,0,.07), transparent 18%),
        radial-gradient(circle at 70% 62%, rgba(0,0,0,.05), transparent 28%),
        linear-gradient(125deg, transparent 0 48%, rgba(0,0,0,.035) 48% 49%, transparent 49% 100%);
      pointer-events:none;
    }
    .hero-art:before{
      content:"";
      position:absolute;
      width:52vw;height:52vw;
      border:1px solid rgba(24,24,21,.12);
      border-radius:50%;
      right:-7vw; top:7vh;
    }
    .hero-art:after{
      content:"";
      position:absolute;
      width:22vw;height:22vw;
      border:1px solid rgba(24,24,21,.18);
      border-radius:50%;
      right:8vw; top:22vh;
    }
    .hero-content{
      position:relative; z-index:2;
      padding-top:130px;
      padding-bottom:clamp(52px,7vw,100px);
    }
    .eyebrow{
      text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;
      margin-bottom:28px;
    }
    h1{
      margin:0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size:clamp(58px,9vw,150px);
      font-weight:400;
      line-height:.86;
      letter-spacing:-.045em;
      max-width:1100px;
    }
    .hero-bottom{
      margin-top:clamp(38px,6vw,85px);
      display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:end;
    }
    .hero-copy{
      max-width:670px;font-size:clamp(20px,2vw,31px);line-height:1.25;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .hero-note{
      font-size:13px;line-height:1.6;max-width:380px;color:var(--soft);
      justify-self:end;
    }
    .scrollcue{
      margin-top:42px;display:inline-flex;gap:12px;align-items:center;
      font-size:11px;text-transform:uppercase;letter-spacing:.14em;
    }
    .scrollcue i{width:38px;height:1px;background:var(--ink);display:inline-block}

    section{border-bottom:1px solid var(--line)}
    .section{padding:clamp(78px,10vw,150px) 0}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,7vw,110px)}
    .label{
      text-transform:uppercase;font-size:11px;letter-spacing:.14em;font-weight:700;
      margin-bottom:25px;
    }
    .display{
      font-family:Georgia, 'Times New Roman', serif;
      font-weight:400;letter-spacing:-.035em;
      font-size:clamp(44px,6vw,88px);
      line-height:.98;margin:0;
    }
    .lead{
      font-family:Georgia, 'Times New Roman', serif;
      font-size:clamp(24px,3.2vw,47px); line-height:1.13;
      letter-spacing:-.02em;margin:0;
    }
    .bodycopy{
      font-size:16px;line-height:1.75;color:var(--soft);max-width:640px;
    }
    .bodycopy p{margin:0 0 20px}

    .manifesto{
      background:var(--ink);color:var(--paper);
      position:relative;overflow:hidden;
    }
    .manifesto .section{min-height:78vh;display:grid;align-items:center}
    .manifesto .display{max-width:1100px}
    .manifesto .ghost{
      position:absolute;right:-4vw;bottom:-13vw;font-family:Georgia, serif;
      font-size:40vw;line-height:1;color:rgba(241,238,230,.025);user-select:none;
    }

    .audience-grid{display:grid;grid-template-columns:1fr 1fr}
    .audience-card{
      min-height:620px;padding:clamp(42px,6vw,82px);
      display:flex;flex-direction:column;justify-content:space-between;
      border-right:1px solid var(--line);
    }
    .audience-card:last-child{border-right:0}
    .audience-card h3{
      font:400 clamp(38px,5vw,72px)/.98 Georgia,serif;
      letter-spacing:-.035em;margin:0 0 30px;
    }
    .audience-card p{max-width:530px;font-size:16px;line-height:1.72;color:var(--soft)}
    .mini-list{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px}
    .pill{
      border:1px solid var(--line);border-radius:999px;padding:8px 11px;
      font-size:11px;text-transform:uppercase;letter-spacing:.07em;
    }

    .nus{
      min-height:100vh;
      background:
        linear-gradient(rgba(17,17,15,.62),rgba(17,17,15,.72)),
        radial-gradient(circle at 15% 20%, #817662 0, #554d41 24%, #312d27 52%, #171715 100%);
      color:#f3f0e8;
      display:grid;align-items:end;
      position:relative;
    }
    .nus:after{
      content:"";
      position:absolute;inset:0;opacity:.18;
      background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.03) 4px);
      pointer-events:none;
    }
    .nus .section{position:relative;z-index:2;width:100%}
    .nus .display{max-width:900px}
    .nus-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:60px}
    .nus p{max-width:610px;font-size:17px;line-height:1.7;color:rgba(243,240,232,.78)}
    .nus-rules{
      list-style:none;margin:0;padding:0;
      font:400 clamp(30px,4vw,58px)/1.15 Georgia,serif;
      letter-spacing:-.025em;
    }
    .nus-rules li{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.22)}

    .flow{counter-reset:flow}
    .flow-item{
      counter-increment:flow;
      display:grid;grid-template-columns:110px 1fr 1fr;
      gap:30px;padding:36px 0;border-top:1px solid var(--line);align-items:start;
    }
    .flow-item:before{content:"0" counter(flow);font:400 20px Georgia,serif}
    .flow-item h4{
      font:400 clamp(28px,3vw,44px)/1.05 Georgia,serif;margin:0;letter-spacing:-.02em
    }
    .flow-item p{margin:0;font-size:15px;line-height:1.7;color:var(--soft);max-width:550px}

    .testimonials{background:var(--paper-2)}
    .quote-card{padding:45px 0;border-top:1px solid var(--line)}
    .quote-card blockquote{
      margin:0;max-width:1100px;font:400 clamp(27px,4vw,56px)/1.15 Georgia,serif;
      letter-spacing:-.025em
    }
    .quote-card footer{margin-top:22px;text-transform:uppercase;letter-spacing:.12em;font-size:11px}

    .about-copy{
      columns:2;column-gap:60px;
      font-size:16px;line-height:1.75;color:var(--soft);
    }
    .about-copy p{margin-top:0;break-inside:avoid}

    .contact{
      background:var(--ink);color:var(--paper);position:relative;overflow:hidden;
    }
    .contact .section{min-height:78vh;display:flex;flex-direction:column;justify-content:space-between}
    .contact .display{max-width:1000px}
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:end;margin-top:80px}
    .contact-copy{font:400 clamp(22px,2.7vw,38px)/1.25 Georgia,serif;max-width:650px}
    .contact-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
    .btn{
      border:1px solid rgba(243,240,232,.52);
      border-radius:999px;padding:14px 18px;
      text-transform:uppercase;letter-spacing:.09em;font-size:11px;
      transition:.2s;background:transparent;color:inherit;
    }
    .btn:hover{background:var(--paper);color:var(--ink)}
    .footerline{
      margin-top:90px;padding-top:24px;border-top:1px solid rgba(243,240,232,.2);
      display:flex;justify-content:space-between;gap:20px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;opacity:.72
    }

    .reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease, transform .7s ease}
    .reveal.visible{opacity:1;transform:none}

    @media(max-width:800px){
      .navlinks{display:none}
      .hero-bottom,.grid2,.nus-grid,.contact-grid{grid-template-columns:1fr}
      .hero-note{justify-self:start}
      .audience-grid{grid-template-columns:1fr}
      .audience-card{min-height:auto;border-right:0;border-bottom:1px solid var(--line)}
      .flow-item{grid-template-columns:55px 1fr}
      .flow-item p{grid-column:2}
      .about-copy{columns:1}
      .contact-actions{justify-content:flex-start}
      h1{font-size:clamp(62px,18vw,110px)}
    }
  </style>
</head>

        <div class="flow-item reveal"><h4 id="process3Title"></h4><p id="process3Text"></p></div>
        <div class="flow-item reveal"><h4 id="process4Title"></h4><p id="process4Text"></p></div>
      </div>
    </div>
  </section>

  <section class="testimonials">
    <div class="shell section">
      <div class="label reveal" id="testimonialsLabel"></div>
      <article class="quote-card reveal"><blockquote id="testimonial1"></blockquote><footer id="testimonial1Name"></footer></article>
      <article class="quote-card reveal"><blockquote id="testimonial2"></blockquote><footer id="testimonial2Name"></footer></article>
      <article class="quote-card reveal"><blockquote id="testimonial3"></blockquote><footer id="testimonial3Name"></footer></article>
    </div>
  </section>

  <section id="qui">
    <div class="shell section">
      <div class="grid2">
        <div>
          <div class="label reveal" id="aboutLabel"></div>
          <h2 class="display reveal" id="aboutTitle"></h2>
        </div>
        <div class="about-copy reveal" id="aboutParagraphs"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="shell section">
      <div class="label reveal" id="formatsLabel"></div>
      <div class="grid2">
        <h2 class="display reveal" id="formatsTitle"></h2>
        <div class="bodycopy reveal">
          <p id="formatsP1"></p>
          <p id="formatsP2"></p>
          <p><strong id="formatsP3"></strong></p>
          <p id="formatsP4"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="shell section">
      <div>
        <div class="label reveal" id="contactLabel"></div>
        <h2 class="display reveal"><span id="contactTitleLine1"></span><br><span id="contactTitleLine2"></span></h2>
      </div>
      <div>
        <div class="contact-grid">
          <p class="contact-copy reveal" id="contactText"></p>
          <div class="contact-actions reveal">
            <a class="btn" id="emailButton"></a>
            <a class="btn" id="whatsappButton"></a>
          </div>
        </div>
        <div class="footerline reveal">
          <span id="footerName"></span>
          <span id="footerPositioning"></span>
          <span id="footerLocation"></span>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  function setText(id, value){
    const el = document.getElementById(id);
    if(el) el.textContent = value;
  }

  const simpleKeys = [
    "positioning","heroTitle","heroIntro","heroNote","heroLink",
    "approachLabel","approachTitle","approachLead","approachP1","approachP2","approachP3",
    "manifestoLabel","manifestoTitle","manifestoEmphasis",
    "individualLabel","individualTitle","individualText",
    "collectiveLabel","collectiveTitle","collectiveText",
    "nusLabel","nusTitleLine1","nusTitleLine2","nusP1","nusP2","nusP3",
    "processLabel","processTitle","processIntro",
    "process1Title","process1Text","process2Title","process2Text",
    "process3Title","process3Text","process4Title","process4Text",
    "testimonialsLabel","testimonial1","testimonial1Name","testimonial2","testimonial2Name",
    "testimonial3","testimonial3Name","aboutLabel","aboutTitle",
    "formatsLabel","formatsTitle","formatsP1","formatsP2","formatsP3","formatsP4",
    "contactLabel","contactTitleLine1","contactTitleLine2","contactText"
  ];
  simpleKeys.forEach(k=>setText(k, CONTENT[k]));

  setText("navName", CONTENT.name);
  setText("footerName", CONTENT.name);
  setText("footerPositioning", CONTENT.positioning);
  setText("footerLocation", CONTENT.footerLocation);

  const individualTags = document.getElementById("individualTags");
  CONTENT.individualTags.forEach(tag=>{
    const span=document.createElement("span");
    span.className="pill"; span.textContent=tag; individualTags.appendChild(span);
  });

  const collectiveTags = document.getElementById("collectiveTags");
  CONTENT.collectiveTags.forEach(tag=>{
    const span=document.createElement("span");
    span.className="pill"; span.textContent=tag; collectiveTags.appendChild(span);
  });

  const nusRules = document.getElementById("nusRules");
  CONTENT.nusRules.forEach(rule=>{
    const li=document.createElement("li");
    li.textContent=rule; nusRules.appendChild(li);
  });

  const aboutParagraphs = document.getElementById("aboutParagraphs");
  CONTENT.aboutParagraphs.forEach(txt=>{
    const p=document.createElement("p");
    p.textContent=txt; aboutParagraphs.appendChild(p);
  });

  const emailButton = document.getElementById("emailButton");
  emailButton.textContent = CONTENT.emailText;
  emailButton.href = "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(CONTENT.emailAddress);
  emailButton.target = "_blank";
  emailButton.rel = "noopener noreferrer";

  const whatsappButton = document.getElementById("whatsappButton");
  whatsappButton.textContent = CONTENT.whatsappText;
  whatsappButton.href = CONTENT.whatsappUrl;
  whatsappButton.target = "_blank";
  whatsappButton.rel = "noopener noreferrer";

  const nav = document.getElementById('nav');
  window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',window.scrollY>20));

  const io = new IntersectionObserver((entries)=>{
    entries.forEach((entry)=>{
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
        io.unobserve(entry.target);
      }
    });
  },{threshold:.08});

  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>

</body>
</html>
